<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <title>iPhone Proximity Beeper</title>

  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(20,20,24,.84);
      --border: rgba(255,255,255,.14);
      --muted: rgba(255,255,255,.68);
      --good: #43e887;
      --warn: #ffd54a;
      --danger: #ff5353;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "SF Pro Text", system-ui, sans-serif;
    }

    #stage {
      position: fixed;
      inset: 0;
      background: #000;
    }

    #video, #overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #overlay {
      pointer-events: none;
    }

    #work {
      display: none;
    }

    .top {
      position: absolute;
      z-index: 10;
      top: max(12px, env(safe-area-inset-top));
      left: 12px;
      right: 12px;
    }

    .card {
      background: var(--panel);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px 14px;
      box-shadow: 0 8px 28px rgba(0,0,0,.32);
    }

    #status {
      font-size: 17px;
      font-weight: 760;
    }

    #detail {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.3;
    }

    .meter {
      margin-top: 10px;
      height: 9px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255,255,255,.13);
    }

    #meterFill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: var(--good);
      transition: width .08s linear, background .08s linear;
    }

    .bottom {
      position: absolute;
      z-index: 10;
      left: 12px;
      right: 12px;
      bottom: max(12px, env(safe-area-inset-bottom));
      display: grid;
      gap: 10px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      appearance: none;
      -webkit-appearance: none;
      min-height: 54px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 16px;
      color: #fff;
      background: rgba(255,255,255,.16);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      font: inherit;
      font-size: 16px;
      font-weight: 750;
    }

    button:active {
      transform: scale(.985);
    }

    #startBtn {
      color: #000;
      background: #fff;
    }

    #stopBtn {
      background: rgba(255,83,83,.25);
    }

    .tiny {
      text-align: center;
      color: rgba(255,255,255,.56);
      font-size: 11px;
      line-height: 1.3;
    }

    #help {
      display: none;
      position: absolute;
      z-index: 20;
      inset: 0;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0,0,0,.88);
    }

    #help.show {
      display: flex;
    }

    #help .card {
      width: min(430px, 100%);
      padding: 20px;
    }

    #help h2 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    #help p {
      margin: 8px 0;
      color: rgba(255,255,255,.82);
      line-height: 1.45;
      font-size: 15px;
    }

    #help button {
      width: 100%;
      margin-top: 12px;
    }
  </style>
</head>

<body>
<div id="stage">
  <video id="video" autoplay muted playsinline></video>
  <canvas id="overlay"></canvas>

  <!-- Small hidden canvas. All proximity processing happens here. -->
  <canvas id="work" width="160" height="120"></canvas>

  <div class="top">
    <div class="card">
      <div id="status">Ready</div>
      <div id="detail">
        Watches for surfaces rapidly expanding toward the camera.
      </div>
      <div class="meter"><div id="meterFill"></div></div>
    </div>
  </div>

  <div class="bottom">
    <button id="startBtn">Start Proximity Detector</button>

    <div class="row">
      <button id="cameraBtn">Use Front Camera</button>
      <button id="soundBtn">Sound: On</button>
    </div>

    <div class="row">
      <button id="zoneBtn">Scan Zone: Wide</button>
      <button id="resetBtn">Reset Warning</button>
    </div>

    <button id="stopBtn" style="display:none;">Stop</button>

    <div class="tiny">
      Fixed 950 Hz beep. Pitch never changes — only beep frequency changes.
    </div>
  </div>

  <div id="help">
    <div class="card">
      <h2>Couldn't start</h2>
      <p id="helpText"></p>
      <button id="closeHelp">Close</button>
    </div>
  </div>
</div>

<script>
(() => {
  const video = document.getElementById("video");
  const overlay = document.getElementById("overlay");
  const octx = overlay.getContext("2d");

  const work = document.getElementById("work");
  const wctx = work.getContext("2d", { willReadFrequently: true });

  const statusEl = document.getElementById("status");
  const detailEl = document.getElementById("detail");
  const meterFill = document.getElementById("meterFill");

  const startBtn = document.getElementById("startBtn");
  const stopBtn = document.getElementById("stopBtn");
  const cameraBtn = document.getElementById("cameraBtn");
  const soundBtn = document.getElementById("soundBtn");
  const zoneBtn = document.getElementById("zoneBtn");
  const resetBtn = document.getElementById("resetBtn");

  const help = document.getElementById("help");
  const helpText = document.getElementById("helpText");
  const closeHelp = document.getElementById("closeHelp");

  let stream = null;
  let running = false;
  let soundEnabled = true;
  let facingMode = "environment";
  let scanWide = true;

  let audioCtx = null;
  let nextBeepAt = 0;

  let previousGray = null;
  let previousTime = 0;

  let danger = 0;
  let smoothedExpansion = 0;
  let smoothedConfidence = 0;

  // -------------------- TUNING --------------------

  // Very small frame keeps this practical on iPhone Safari.
  const FRAME_W = 160;
  const FRAME_H = 120;

  // Run optical-flow analysis around 10 times per second.
  const ANALYZE_EVERY_MS = 95;

  // Fixed beep pitch: NEVER changed by proximity.
  const BEEP_HZ = 950;
  const BEEP_DURATION = 0.048;

  // Only spacing between beeps changes.
  const FAR_INTERVAL = 1.70;
  const CLOSE_INTERVAL = 0.055;

  // Optical-flow grid / matching settings.
  const PATCH_RADIUS = 2;
  const SEARCH_RADIUS = 4;
  const GRID_STEP = 13;

  // How much outward image motion counts as approaching.
  const EXPANSION_START = 0.012;
  const EXPANSION_DANGER = 0.105;

  // Danger rises quickly when approaching and falls more slowly.
  const ATTACK = 0.33;
  const RELEASE = 0.045;

  // ------------------------------------------------

  function clamp(v, lo, hi) {
    return Math.max(lo, Math.min(hi, v));
  }

  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  function setStatus(title, detail) {
    statusEl.textContent = title;
    detailEl.textContent = detail;
  }

  function showHelp(message) {
    helpText.textContent = message;
    help.classList.add("show");
  }

  closeHelp.addEventListener("click", () => {
    help.classList.remove("show");
  });

  async function prepareAudio() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
    }

    if (audioCtx.state === "suspended") {
      await audioCtx.resume();
    }
  }

  function beep() {
    if (!soundEnabled || !audioCtx) return;

    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    // EXACT SAME PITCH EVERY TIME.
    osc.frequency.value = BEEP_HZ;
    osc.type = "sine";

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.24, now + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + BEEP_DURATION);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + BEEP_DURATION + 0.006);
  }

  function beepInterval(p) {
    // Curved response = dramatic increase near maximum danger.
    const t = Math.pow(clamp(p, 0, 1), 1.75);
    return lerp(FAR_INTERVAL, CLOSE_INTERVAL, t);
  }

  function updateMeter(p) {
    meterFill.style.width = `${Math.round(p * 100)}%`;

    if (p >= 0.72) {
      meterFill.style.background = "#ff5353";
    } else if (p >= 0.38) {
      meterFill.style.background = "#ffd54a";
    } else {
      meterFill.style.background = "#43e887";
    }
  }

  function resizeOverlay() {
    const rect = video.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    overlay.width = Math.round(rect.width * dpr);
    overlay.height = Math.round(rect.height * dpr);
    overlay.style.width = rect.width + "px";
    overlay.style.height = rect.height + "px";

    octx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function drawOverlay() {
    resizeOverlay();

    const sw = video.clientWidth;
    const sh = video.clientHeight;

    octx.clearRect(0, 0, sw, sh);

    const zoneW = scanWide ? sw * 0.78 : sw * 0.48;
    const zoneH = sh * 0.62;
    const x = (sw - zoneW) / 2;
    const y = sh * 0.19;

    let color = "rgba(67,232,135,.95)";
    if (danger >= 0.72) color = "rgba(255,83,83,.98)";
    else if (danger >= 0.38) color = "rgba(255,213,74,.98)";

    octx.strokeStyle = color;
    octx.lineWidth = danger >= 0.72 ? 5 : 3;
    octx.setLineDash([12, 9]);
    octx.strokeRect(x, y, zoneW, zoneH);
    octx.setLineDash([]);

    if (danger >= 0.72) {
      octx.fillStyle = "rgba(255,83,83,.09)";
      octx.fillRect(x, y, zoneW, zoneH);
    }
  }

  function captureGray() {
    const vw = video.videoWidth;
    const vh = video.videoHeight;

    if (!vw || !vh) return null;

    const targetRatio = FRAME_W / FRAME_H;
    const videoRatio = vw / vh;

    let sx = 0;
    let sy = 0;
    let sw = vw;
    let sh = vh;

    if (videoRatio > targetRatio) {
      sw = vh * targetRatio;
      sx = (vw - sw) / 2;
    } else {
      sh = vw / targetRatio;
      sy = (vh - sh) / 2;
    }

    wctx.save();

    if (facingMode === "user") {
      wctx.translate(FRAME_W, 0);
      wctx.scale(-1, 1);
    }

    wctx.drawImage(video, sx, sy, sw, sh, 0, 0, FRAME_W, FRAME_H);
    wctx.restore();

    const rgba = wctx.getImageData(0, 0, FRAME_W, FRAME_H).data;
    const gray = new Uint8Array(FRAME_W * FRAME_H);

    // Lightweight integer grayscale conversion.
    for (let i = 0, p = 0; i < rgba.length; i += 4, p++) {
      gray[p] = (rgba[i] * 77 + rgba[i + 1] * 150 + rgba[i + 2] * 29) >> 8;
    }

    return gray;
  }

  function patchSAD(prev, curr, x, y, dx, dy) {
    let sad = 0;
    let count = 0;

    for (let py = -PATCH_RADIUS; py <= PATCH_RADIUS; py++) {
      const y1 = y + py;
      const y2 = y + dy + py;

      if (y1 < 0 || y1 >= FRAME_H || y2 < 0 || y2 >= FRAME_H) continue;

      for (let px = -PATCH_RADIUS; px <= PATCH_RADIUS; px++) {
        const x1 = x + px;
        const x2 = x + dx + px;

        if (x1 < 0 || x1 >= FRAME_W || x2 < 0 || x2 >= FRAME_W) continue;

        const a = prev[y1 * FRAME_W + x1];
        const b = curr[y2 * FRAME_W + x2];

        sad += Math.abs(a - b);
        count++;
      }
    }

    return count ? sad / count : 255;
  }

  function localTexture(gray, x, y) {
    const c = gray[y * FRAME_W + x];

    const right = gray[y * FRAME_W + Math.min(FRAME_W - 1, x + 2)];
    const down = gray[Math.min(FRAME_H - 1, y + 2) * FRAME_W + x];

    return Math.abs(c - right) + Math.abs(c - down);
  }

  function estimateExpansion(prev, curr, dtSec) {
    const cx = FRAME_W / 2;
    const cy = FRAME_H / 2;

    const zoneWidth = scanWide ? 0.78 : 0.48;
    const x0 = Math.floor(FRAME_W * (0.5 - zoneWidth / 2));
    const x1 = Math.ceil(FRAME_W * (0.5 + zoneWidth / 2));
    const y0 = Math.floor(FRAME_H * 0.20);
    const y1 = Math.ceil(FRAME_H * 0.80);

    let radialSum = 0;
    let radialWeight = 0;
    let outwardCount = 0;
    let used = 0;

    for (let y = y0 + 8; y < y1 - 8; y += GRID_STEP) {
      for (let x = x0 + 8; x < x1 - 8; x += GRID_STEP) {

        // Flat blank walls have almost no trackable features.
        // Skip extremely featureless points instead of inventing flow.
        const texture = localTexture(prev, x, y);
        if (texture < 10) continue;

        let bestDx = 0;
        let bestDy = 0;
        let bestError = Infinity;
        let secondBest = Infinity;

        for (let dy = -SEARCH_RADIUS; dy <= SEARCH_RADIUS; dy++) {
          for (let dx = -SEARCH_RADIUS; dx <= SEARCH_RADIUS; dx++) {
            const err = patchSAD(prev, curr, x, y, dx, dy);

            if (err < bestError) {
              secondBest = bestError;
              bestError = err;
              bestDx = dx;
              bestDy = dy;
            } else if (err < secondBest) {
              secondBest = err;
            }
          }
        }

        // Reject poor/ambiguous matches.
        if (bestError > 38) continue;
        if (secondBest < Infinity && secondBest - bestError < 0.6) continue;

        const rx = x - cx;
        const ry = y - cy;
        const radius = Math.sqrt(rx * rx + ry * ry);

        if (radius < 10) continue;

        // Radial flow: positive means features move outward from center,
        // the classic "looming" cue when approaching a surface.
        const radialPixels =
          (bestDx * rx + bestDy * ry) / radius;

        // Normalize by radius: an expanding image generates more motion
        // farther from the center.
        const normalized = radialPixels / radius;

        // Convert to approximate expansion per second.
        const rate = normalized / Math.max(0.04, dtSec);

        // Weight more reliable textured patches a little more.
        const weight = clamp(texture / 55, 0.35, 1.0);

        radialSum += rate * weight;
        radialWeight += weight;
        used++;

        if (rate > 0.012) outwardCount++;
      }
    }

    if (!radialWeight || used < 4) {
      return {
        expansion: 0,
        confidence: 0,
        points: used
      };
    }

    const meanExpansion = radialSum / radialWeight;
    const outwardRatio = outwardCount / used;

    // Real forward approach tends to make many points move outward,
    // not just one noisy block.
    const confidence = clamp((outwardRatio - 0.30) / 0.55, 0, 1);

    const expansion = Math.max(0, meanExpansion) * confidence;

    return {
      expansion,
      confidence,
      points: used
    };
  }

  function updateDanger(expansion, confidence) {
    smoothedExpansion =
      smoothedExpansion * 0.68 + expansion * 0.32;

    smoothedConfidence =
      smoothedConfidence * 0.70 + confidence * 0.30;

    let target = 0;

    if (smoothedConfidence > 0.10) {
      target = clamp(
        (smoothedExpansion - EXPANSION_START) /
        (EXPANSION_DANGER - EXPANSION_START),
        0,
        1
      );
    }

    if (target > danger) {
      danger = lerp(danger, target, ATTACK);
    } else {
      danger = Math.max(0, danger - RELEASE);
    }

    updateMeter(danger);
    drawOverlay();

    const interval = beepInterval(danger);

    if (smoothedConfidence < 0.08) {
      setStatus(
        "Scanning",
        "Not enough visible texture yet — point toward edges, furniture, doors, or a textured wall."
      );
    } else if (danger >= 0.80) {
      setStatus(
        "VERY CLOSE / CLOSING FAST",
        `Warning ${Math.round(danger * 100)}% · beep every ${interval.toFixed(2)}s`
      );
    } else if (danger >= 0.55) {
      setStatus(
        "CLOSE",
        `Warning ${Math.round(danger * 100)}% · beep every ${interval.toFixed(2)}s`
      );
    } else if (danger >= 0.25) {
      setStatus(
        "APPROACHING",
        `Warning ${Math.round(danger * 100)}% · beep every ${interval.toFixed(2)}s`
      );
    } else {
      setStatus(
        "CLEAR",
        `Surface motion low · fixed ${BEEP_HZ} Hz tone`
      );
    }
  }

  function analyze(now) {
    if (!running || video.readyState < 2) return;

    const gray = captureGray();
    if (!gray) return;

    if (previousGray && previousTime) {
      const dt = (now - previousTime) / 1000;
      const result = estimateExpansion(previousGray, gray, dt);

      updateDanger(result.expansion, result.confidence);
    }

    previousGray = gray;
    previousTime = now;
  }

  let lastAnalyze = 0;

  function mainLoop(now) {
    if (!running) return;

    if (now - lastAnalyze >= ANALYZE_EVERY_MS) {
      lastAnalyze = now;
      analyze(now);
    }

    const interval = beepInterval(danger);

    if (danger > 0.05 && now >= nextBeepAt) {
      beep();
      nextBeepAt = now + interval * 1000;
    }

    requestAnimationFrame(mainLoop);
  }

  function resetWarning() {
    danger = 0;
    smoothedExpansion = 0;
    smoothedConfidence = 0;
    previousGray = null;
    previousTime = 0;
    nextBeepAt = performance.now();

    updateMeter(0);
    drawOverlay();

    setStatus(
      "Reset",
      "Move toward a surface and the warning will build again."
    );
  }

  async function startCamera() {
    try {
      await prepareAudio();

      if (!window.isSecureContext) {
        showHelp(
          "iPhone camera access requires HTTPS. Open this page from a secure https:// address in Safari."
        );
        return;
      }

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showHelp(
          "Camera access is unavailable. Open this page in Safari and allow camera permission."
        );
        return;
      }

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }

      setStatus("Starting camera…", "Allow camera access if Safari asks.");

      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: facingMode },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      });

      video.srcObject = stream;
      await video.play();

      video.style.transform =
        facingMode === "user" ? "scaleX(-1)" : "none";

      running = true;
      lastAnalyze = 0;

      resetWarning();

      startBtn.style.display = "none";
      stopBtn.style.display = "block";

      cameraBtn.textContent =
        facingMode === "environment"
          ? "Use Front Camera"
          : "Use Back Camera";

      setStatus(
        "Scanning",
        "Move toward a wall, door, furniture, person, or other visible surface."
      );

      requestAnimationFrame(mainLoop);

    } catch (err) {
      console.error(err);

      let message = "Safari could not start the camera.";

      if (err && err.name === "NotAllowedError") {
        message += " Camera permission was denied. Allow Safari camera access in iPhone Settings, then reload.";
      } else if (err && err.message) {
        message += " " + err.message;
      }

      showHelp(message);
      setStatus("Stopped", "Tap Start Proximity Detector to try again.");
    }
  }

  function stopCamera() {
    running = false;

    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }

    video.srcObject = null;

    resetWarning();

    octx.clearRect(0, 0, overlay.width, overlay.height);

    startBtn.style.display = "block";
    stopBtn.style.display = "none";

    setStatus("Stopped", "Tap Start Proximity Detector when you're ready.");
  }

  async function switchCamera() {
    facingMode =
      facingMode === "environment" ? "user" : "environment";

    cameraBtn.textContent =
      facingMode === "environment"
        ? "Use Front Camera"
        : "Use Back Camera";

    if (!running) return;

    running = false;

    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }

    await startCamera();
  }

  startBtn.addEventListener("click", startCamera);
  stopBtn.addEventListener("click", stopCamera);
  cameraBtn.addEventListener("click", switchCamera);
  resetBtn.addEventListener("click", resetWarning);

  zoneBtn.addEventListener("click", () => {
    scanWide = !scanWide;

    zoneBtn.textContent =
      scanWide ? "Scan Zone: Wide" : "Scan Zone: Center";

    resetWarning();
  });

  soundBtn.addEventListener("click", async () => {
    soundEnabled = !soundEnabled;

    soundBtn.textContent =
      soundEnabled ? "Sound: On" : "Sound: Off";

    if (soundEnabled) {
      await prepareAudio();
      beep();
    }
  });

  window.addEventListener("resize", drawOverlay);

  window.addEventListener("orientationchange", () => {
    setTimeout(drawOverlay, 250);
  });
})();
</script>
</body>
</html>
