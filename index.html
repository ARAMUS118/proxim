<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <title>Person Proximity Beeper</title>

  <!-- TensorFlow.js + COCO-SSD person detector -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(20, 20, 24, 0.82);
      --border: rgba(255,255,255,.14);
      --muted: rgba(255,255,255,.68);
      --good: #43e887;
      --warn: #ffd54a;
      --danger: #ff5353;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "SF Pro Text", system-ui, sans-serif;
    }

    #stage {
      position: fixed;
      inset: 0;
      background: #000;
    }

    video, canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    video { transform: none; }

    canvas { pointer-events: none; }

    .top {
      position: absolute;
      z-index: 10;
      top: max(12px, env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      display: grid;
      gap: 8px;
    }

    .card {
      background: var(--panel);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px 14px;
      box-shadow: 0 8px 28px rgba(0,0,0,.32);
    }

    #status {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.2;
    }

    #detail {
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.25;
    }

    .meter {
      margin-top: 9px;
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255,255,255,.13);
    }

    #meterFill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: var(--good);
      transition: width .12s linear, background .12s linear;
    }

    .bottom {
      position: absolute;
      z-index: 10;
      left: 12px;
      right: 12px;
      bottom: max(12px, env(safe-area-inset-bottom));
      display: grid;
      gap: 10px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      appearance: none;
      -webkit-appearance: none;
      border: 0;
      border-radius: 16px;
      min-height: 54px;
      padding: 12px 14px;
      font: inherit;
      font-size: 16px;
      font-weight: 750;
      color: #fff;
      background: rgba(255,255,255,.16);
      border: 1px solid var(--border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    button:active { transform: scale(.985); }

    #startBtn {
      background: #fff;
      color: #000;
    }

    #stopBtn {
      background: rgba(255,83,83,.26);
    }

    #help {
      display: none;
      position: absolute;
      z-index: 20;
      inset: 0;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0,0,0,.86);
    }

    #help.show { display: flex; }

    #help .card {
      width: min(420px, 100%);
      padding: 20px;
    }

    #help h2 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    #help p {
      margin: 8px 0;
      color: rgba(255,255,255,.82);
      line-height: 1.45;
      font-size: 15px;
    }

    #help button { width: 100%; margin-top: 12px; }

    .tiny {
      text-align: center;
      color: rgba(255,255,255,.55);
      font-size: 11px;
    }
  </style>
</head>

<body>
  <div id="stage">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>

    <div class="top">
      <div class="card">
        <div id="status">Ready</div>
        <div id="detail">Tap Start Camera. The beep gets faster as a detected person gets closer.</div>
        <div class="meter"><div id="meterFill"></div></div>
      </div>
    </div>

    <div class="bottom">
      <button id="startBtn">Start Camera</button>
      <div class="row">
        <button id="cameraBtn">Use Front Camera</button>
        <button id="soundBtn">Sound: On</button>
      </div>
      <button id="stopBtn" style="display:none;">Stop</button>
      <div class="tiny">Distance is estimated from how large the closest person appears on screen.</div>
    </div>

    <div id="help">
      <div class="card">
        <h2>Camera couldn't start</h2>
        <p id="helpText"></p>
        <button id="closeHelp">Close</button>
      </div>
    </div>
  </div>

<script>
(() => {
  const video = document.getElementById("video");
  const canvas = document.getElementById("overlay");
  const ctx = canvas.getContext("2d");

  const statusEl = document.getElementById("status");
  const detailEl = document.getElementById("detail");
  const meterFill = document.getElementById("meterFill");

  const startBtn = document.getElementById("startBtn");
  const stopBtn = document.getElementById("stopBtn");
  const cameraBtn = document.getElementById("cameraBtn");
  const soundBtn = document.getElementById("soundBtn");

  const help = document.getElementById("help");
  const helpText = document.getElementById("helpText");
  const closeHelp = document.getElementById("closeHelp");

  let model = null;
  let stream = null;
  let running = false;
  let detecting = false;
  let soundEnabled = true;
  let facingMode = "environment";

  let audioCtx = null;
  let nextBeepAt = 0;
  let lastDetectionAt = 0;

  // ---- Tuning ----
  const MIN_SCORE = 0.52;
  const DETECT_EVERY_MS = 220;

  // Approximate screen-area fractions for "far" and "very close".
  const FAR_AREA = 0.025;
  const CLOSE_AREA = 0.48;

  const FAR_INTERVAL = 1.45;
  const CLOSE_INTERVAL = 0.075;
  // ----------------

  function setStatus(title, detail) {
    statusEl.textContent = title;
    detailEl.textContent = detail;
  }

  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  function showHelp(message) {
    helpText.textContent = message;
    help.classList.add("show");
  }

  closeHelp.addEventListener("click", () => help.classList.remove("show"));

  async function prepareAudio() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
    }
    if (audioCtx.state === "suspended") {
      await audioCtx.resume();
    }
  }

  function beep(proximity) {
    if (!soundEnabled || !audioCtx) return;

    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    // Slight pitch increase as the person gets closer.
    osc.frequency.value = 720 + proximity * 700;
    osc.type = "sine";

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.22, now + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.07);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + 0.075);
  }

  function resizeCanvas() {
    const rect = video.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    canvas.style.width = rect.width + "px";
    canvas.style.height = rect.height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function videoToScreenRect(bbox) {
    // bbox is in the video's intrinsic pixel coordinates.
    const [x, y, w, h] = bbox;

    const vw = video.videoWidth;
    const vh = video.videoHeight;

    const sw = video.clientWidth;
    const sh = video.clientHeight;

    // object-fit: cover
    const scale = Math.max(sw / vw, sh / vh);
    const renderedW = vw * scale;
    const renderedH = vh * scale;
    const cropX = (renderedW - sw) / 2;
    const cropY = (renderedH - sh) / 2;

    let sx = x * scale - cropX;
    const sy = y * scale - cropY;
    const sWidth = w * scale;
    const sHeight = h * scale;

    // Front camera is mirrored visually.
    if (facingMode === "user") {
      sx = sw - sx - sWidth;
    }

    return [sx, sy, sWidth, sHeight];
  }

  function drawPeople(people, closestIndex) {
    resizeCanvas();
    ctx.clearRect(0, 0, video.clientWidth, video.clientHeight);

    people.forEach((p, i) => {
      const [x, y, w, h] = videoToScreenRect(p.bbox);
      const closest = i === closestIndex;

      ctx.strokeStyle = closest ? "#ff5353" : "#43e887";
      ctx.lineWidth = closest ? 4 : 2;
      ctx.strokeRect(x, y, w, h);

      ctx.font = "700 15px -apple-system, system-ui, sans-serif";
      ctx.fillStyle = closest ? "#ff5353" : "#43e887";
      ctx.fillText(
        closest ? "CLOSEST PERSON" : "PERSON",
        x + 4,
        Math.max(20, y - 7)
      );
    });
  }

  function clearOverlay() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  async function loadModel() {
    if (model) return;

    setStatus("Loading detector…", "This normally happens only when the page is first opened.");

    if (!window.cocoSsd) {
      throw new Error("The person-detection library did not load. Check your internet connection.");
    }

    model = await cocoSsd.load({ base: "lite_mobilenet_v2" });
  }

  async function startCamera() {
    try {
      await prepareAudio();

      if (!window.isSecureContext) {
        showHelp(
          "iPhone camera access requires this page to be opened from a secure HTTPS website. " +
          "Opening the raw HTML file directly from the Files app may not allow camera access."
        );
        return;
      }

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showHelp("This browser does not expose camera access. Open the page in Safari.");
        return;
      }

      await loadModel();

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }

      setStatus("Starting camera…", "Allow camera permission if Safari asks.");

      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: facingMode },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      });

      video.srcObject = stream;
      await video.play();

      // Mirror selfie camera.
      video.style.transform = facingMode === "user" ? "scaleX(-1)" : "none";

      running = true;
      nextBeepAt = performance.now();
      lastDetectionAt = 0;

      startBtn.style.display = "none";
      stopBtn.style.display = "block";
      cameraBtn.textContent =
        facingMode === "environment" ? "Use Front Camera" : "Use Back Camera";

      setStatus("Looking for people…", "No beep until a person is detected.");
      requestAnimationFrame(loop);

    } catch (err) {
      console.error(err);

      let msg = "Safari could not start the camera.";
      if (err && err.name === "NotAllowedError") {
        msg += " Camera permission was denied. In iPhone Settings, allow Safari camera access, then reload.";
      } else if (err && err.message) {
        msg += " " + err.message;
      }

      showHelp(msg);
      setStatus("Camera stopped", "Tap Start Camera to try again.");
    }
  }

  function stopCamera() {
    running = false;
    detecting = false;

    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }

    video.srcObject = null;
    clearOverlay();

    meterFill.style.width = "0%";
    meterFill.style.background = "#43e887";

    startBtn.style.display = "block";
    stopBtn.style.display = "none";

    setStatus("Stopped", "Tap Start Camera when you're ready.");
  }

  async function switchCamera() {
    facingMode = facingMode === "environment" ? "user" : "environment";
    cameraBtn.textContent =
      facingMode === "environment" ? "Use Front Camera" : "Use Back Camera";

    if (running) {
      running = false;
      if (stream) stream.getTracks().forEach(track => track.stop());
      stream = null;

      // Restart from a user button press.
      await startCamera();
    }
  }

  function setMeter(proximity) {
    meterFill.style.width = `${Math.round(proximity * 100)}%`;

    if (proximity > 0.72) {
      meterFill.style.background = "#ff5353";
    } else if (proximity > 0.38) {
      meterFill.style.background = "#ffd54a";
    } else {
      meterFill.style.background = "#43e887";
    }
  }

  async function detectOnce(nowMs) {
    if (!model || video.readyState < 2 || detecting) return;

    detecting = true;

    try {
      const predictions = await model.detect(video);

      const people = predictions.filter(
        p => p.class === "person" && p.score >= MIN_SCORE
      );

      if (!people.length) {
        clearOverlay();
        setMeter(0);
        setStatus("No person detected", "Point the camera toward a person.");
        nextBeepAt = nowMs;
        return;
      }

      const frameArea = video.videoWidth * video.videoHeight;

      let closestIndex = 0;
      let largestArea = 0;

      people.forEach((p, i) => {
        const area = p.bbox[2] * p.bbox[3];
        if (area > largestArea) {
          largestArea = area;
          closestIndex = i;
        }
      });

      const areaFraction = largestArea / frameArea;

      const proximity = clamp(
        (areaFraction - FAR_AREA) / (CLOSE_AREA - FAR_AREA),
        0,
        1
      );

      const intervalSeconds =
        FAR_INTERVAL - proximity * (FAR_INTERVAL - CLOSE_INTERVAL);

      setMeter(proximity);
      drawPeople(people, closestIndex);

      setStatus(
        "Person detected",
        `Estimated proximity ${Math.round(proximity * 100)}% · beep every ${intervalSeconds.toFixed(2)}s`
      );

      if (nowMs >= nextBeepAt) {
        beep(proximity);
        nextBeepAt = nowMs + intervalSeconds * 1000;
      }

    } catch (err) {
      console.error("Detection error:", err);
    } finally {
      detecting = false;
    }
  }

  function loop(nowMs) {
    if (!running) return;

    if (nowMs - lastDetectionAt >= DETECT_EVERY_MS) {
      lastDetectionAt = nowMs;
      detectOnce(nowMs);
    }

    requestAnimationFrame(loop);
  }

  startBtn.addEventListener("click", startCamera);
  stopBtn.addEventListener("click", stopCamera);
  cameraBtn.addEventListener("click", switchCamera);

  soundBtn.addEventListener("click", async () => {
    soundEnabled = !soundEnabled;
    soundBtn.textContent = soundEnabled ? "Sound: On" : "Sound: Off";

    if (soundEnabled) {
      await prepareAudio();
      beep(0.3);
    }
  });

  window.addEventListener("resize", resizeCanvas);
  window.addEventListener("orientationchange", () => {
    setTimeout(resizeCanvas, 250);
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden && audioCtx && audioCtx.state === "running") {
      // iOS may suspend audio itself; nothing else needed.
    }
  });
})();
</script>
</body>
</html>
